version: '3.8'

# ==============================================================================
# ALPHABETTE SASU — Infrastructure Docker Orchestrée via Coolify
# Serveur VPS OVH (Ubuntu 24.04 LTS)
# Routage multi-domaine (alphabette.fr + 15 domaines .fr + redirection 301 alphabette.eu)
# ==============================================================================

networks:
  traefik-public:
    name: coolify-proxy
    external: true
  alphabette-internal:
    name: alphabette-internal
    driver: bridge
    internal: true # Réseau isolé sans accès externe direct

volumes:
  postgres_data:
    name: alphabette_postgres_data
  redis_data:
    name: alphabette_redis_data

services:
  # ----------------------------------------------------------------------------
  # 1. BASE DE DONNÉES POSTGRESQL 16 (Mutualisée mais cloisonnée par schémas)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alphabette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphabette_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Requis}
      POSTGRES_DB: ${POSTGRES_DB:-alphabette_central}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/01_init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql:ro
    networks:
      - alphabette-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphabette_admin} -d ${POSTGRES_DB:-alphabette_central}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------------------------------
  # 2. REDIS 7 (Blacklist de révocations JWT, Rate Limiting & Sessions)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alphabette-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Requis}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - alphabette-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. API D'AUTHENTIFICATION CENTRALISÉE FASTIFY (SSO / JWT)
  # ----------------------------------------------------------------------------
  auth-sso:
    build:
      context: ../auth-sso
      dockerfile: Dockerfile
    container_name: alphabette-auth-sso
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-alphabette_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alphabette_central}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:?Requis}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:?Requis}
      JWT_ISSUER: https://auth.alphabette.fr
      ALPHABETTE_MAIN_DOMAIN: alphabette.fr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik-public
      - alphabette-internal
    labels:
      - "traefik.enable=true"
      # Route HTTPS pour l'API SSO
      - "traefik.http.routers.auth-sso.rule=Host(`auth.alphabette.fr`)"
      - "traefik.http.routers.auth-sso.entrypoints=https"
      - "traefik.http.routers.auth-sso.tls.certresolver=letsencrypt"
      - "traefik.http.services.auth-sso.loadbalancer.server.port=4000"
      # En-têtes de sécurité stricts
      - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.routers.auth-sso.middlewares=security-headers"

  # ----------------------------------------------------------------------------
  # 4. REDIRECTION 301 DE ALPHABETTE.EU VERS ALPHABETTE.FR
  # ----------------------------------------------------------------------------
  redirect-eu:
    image: traefik/whoami:latest
    container_name: alphabette-redirect-eu
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redirect-eu.rule=Host(`alphabette.eu`) || Host(`www.alphabette.eu`)"
      - "traefik.http.routers.redirect-eu.entrypoints=https"
      - "traefik.http.routers.redirect-eu.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.redirect-to-fr.redirectregex.regex=^https?://(www\\.)?alphabette\\.eu/(.*)"
      - "traefik.http.middlewares.redirect-to-fr.redirectregex.replacement=https://alphabette.fr/$${2}"
      - "traefik.http.middlewares.redirect-to-fr.redirectregex.permanent=true"
      - "traefik.http.routers.redirect-eu.middlewares=redirect-to-fr"
